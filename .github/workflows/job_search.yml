name: Daily NL Job Search

on:
  schedule:
    # 06:00 UTC = 08:00 CEST (summer) / 07:00 CET (winter).
    # To pause/resume: Actions tab -> this workflow -> "..." menu -> Disable/Enable workflow.
    - cron: '0 6 * * *'
  workflow_dispatch: {}
    # Adds a manual "Run workflow" button on this workflow's Actions page.

permissions:
  contents: write

jobs:
  run-job-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search engine
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TASK_ID: ${{ secrets.APIFY_TASK_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python app_engine.py

      - name: Commit and push results
        run: |
          git config user.name "job-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f Tailored_CVs Cover_Letters reports QA_roles_*.csv 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Automated run: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No new output to commit (0 qualifying jobs this run)."
          fi
